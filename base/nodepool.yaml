apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: base-cluster-worker-pool
  namespace: clusters
spec:
  arch: amd64
  clusterName: base-cluster
  replicas: 3
  management:
    autoRepair: true
    upgradeType: Replace
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.18.23-multi
  platform:
    type: KubeVirt
    kubevirt:
      compute:
        cores: 12
        memory: 64Gi
      attachDefaultNetwork: false
      rootVolume:
        type: Persistent
        persistent:
          size: 250Gi
          accessModes:
            - ReadWriteMany
          storageClass: ocs-external-storagecluster-ceph-rbd 
          volumeMode: Block

